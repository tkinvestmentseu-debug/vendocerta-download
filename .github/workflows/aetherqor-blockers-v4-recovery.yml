name: AETHERQOR Blockers V4 Recover Blocked Videos

on:
  push:
    paths:
      - 'research/aetherqor/blockers_v4_night/RECOVERY_TRIGGER.txt'

permissions:
  contents: read

concurrency:
  group: aetherqor-blockers-v4-recovery
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build recovery matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          wanted={
            'p1_zremesh_hardsurface_1',
            'p1_zremesh_hardsurface_2',
            'p1_zremesh_hardsurface_3',
            'p4_armor_weight_paint',
          }
          rows=[]
          with open('research/aetherqor/blockers_v4_night/videos.psv',encoding='utf-8') as f:
              for raw in f:
                  line=raw.strip()
                  if not line or line.startswith('#'): continue
                  slug,url,topic=line.split('|',2)
                  if slug in wanted:
                      rows.append({'slug':slug,'url':url,'topic':topic})
          if len(rows)!=4:
              raise SystemExit(f'Expected 4 recovery videos, found {len(rows)}')
          m=json.dumps({'include':rows},separators=(',',':'))
          with open(__import__('os').environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as o:
              o.write('matrix='+m+'\n')
          print(m)
          PY

  process:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, aetherqor-video]
    timeout-minutes: 240
    env:
      LOCAL_ROOT: 'D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare replacement target
        shell: pwsh
        env:
          VIDEO_SLUG: ${{ matrix.slug }}
        run: |
          $videos = Join-Path $env:LOCAL_ROOT 'videos'
          New-Item -ItemType Directory -Path $videos -Force | Out-Null
          $slugDir = Join-Path $videos $env:VIDEO_SLUG
          if(Test-Path $slugDir) { Remove-Item $slugDir -Recurse -Force }
          New-Item -ItemType Directory -Path $slugDir -Force | Out-Null

      - name: Process replacement video directly to D drive
        shell: pwsh
        env:
          VIDEO_URL: ${{ matrix.url }}
          VIDEO_SLUG: ${{ matrix.slug }}
          VIDEO_TOPIC: ${{ matrix.topic }}
        run: |
          $videos = Join-Path $env:LOCAL_ROOT 'videos'
          & .\tools\process-aetherqor-video.ps1 `
            -Url $env:VIDEO_URL `
            -Slug $env:VIDEO_SLUG `
            -Topic $env:VIDEO_TOPIC `
            -Browser chrome `
            -OutputRoot $videos `
            -FrameFps 1 `
            -HighDetailFps 4 `
            -MaxHeight 1080 `
            -HighDetailMaxSeconds 600

      - name: Remove media and verify replacement evidence
        shell: pwsh
        env:
          VIDEO_SLUG: ${{ matrix.slug }}
        run: |
          $root = Join-Path (Join-Path $env:LOCAL_ROOT 'videos') $env:VIDEO_SLUG
          foreach($pattern in @('source.mp4','source.mkv','source.webm','source.mov','source_normalized.mkv')) {
            $p = Join-Path $root $pattern
            if(Test-Path $p) { Remove-Item $p -Force }
          }
          $frameCount = @(Get-ChildItem (Join-Path $root 'frames_1fps') -Filter '*.jpg' -File -ErrorAction SilentlyContinue).Count
          $sheetCount = @(Get-ChildItem (Join-Path $root 'contact_sheets_3x3') -Filter '*.jpg' -File -ErrorAction SilentlyContinue).Count
          $highCount = @(Get-ChildItem (Join-Path $root 'high_detail_4fps') -Recurse -Filter '*.jpg' -File -ErrorAction SilentlyContinue).Count
          $required = @('manifest.json','frame_index.csv','sheet_index.csv','duration_seconds.txt')
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $root $_)) })
          if($missing.Count -gt 0) { throw "Missing required evidence: $($missing -join ', ')" }
          if($frameCount -le 0) { throw 'Zero 1fps frames produced.' }
          if($sheetCount -le 0) { throw 'Zero 3x3 contact sheets produced.' }
          @(
            "slug=$env:VIDEO_SLUG",
            "frames_1fps=$frameCount",
            "sheets_3x3=$sheetCount",
            "high_detail_4fps=$highCount",
            "completed_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content (Join-Path $root '_DONE.txt') -Encoding UTF8
          Write-Host "RECOVERY_VIDEO_READY slug=$env:VIDEO_SLUG frames=$frameCount sheets=$sheetCount high=$highCount"

      - name: Upload lightweight recovery metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqv4-recovery-${{ matrix.slug }}-meta
          path: |
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\manifest.json
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\frame_index.csv
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\sheet_index.csv
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\high_detail_index.csv
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\transcript.txt
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\transcript_source.txt
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\_DONE.txt
            D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT\videos\${{ matrix.slug }}\logs
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

  finalize:
    needs: [prepare, process]
    if: always()
    runs-on: [self-hosted, Windows, X64, aetherqor-video]
    timeout-minutes: 30
    env:
      LOCAL_ROOT: 'D:\AetherqorFoundry\research\blockers_v4_night\ULTRA_RESEARCH_2026-09-04_NIGHT'
      PROCESS_RESULT: ${{ needs.process.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Install current handoff files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:LOCAL_ROOT -Force | Out-Null
          foreach($name in @('PRELIMINARY_VERDICTS.md','SOURCE_REGISTRY.md','CLAUDE_NIGHT_RESEARCH_HANDOFF.md','videos.psv')) {
            Copy-Item (Join-Path 'research/aetherqor/blockers_v4_night' $name) (Join-Path $env:LOCAL_ROOT $name) -Force
          }

      - name: Verify complete 13-video local package
        shell: pwsh
        run: |
          $rows = Get-Content 'research/aetherqor/blockers_v4_night/videos.psv' | Where-Object { $_ -and -not $_.StartsWith('#') }
          $status = New-Object System.Collections.Generic.List[string]
          $status.Add('# AETHERQOR V4 NIGHT ULTRA RESEARCH - RECOVERY FINAL STATUS')
          $status.Add('')
          $status.Add("Recovery process result: $env:PROCESS_RESULT")
          $status.Add("Catalog videos: $($rows.Count)")
          $status.Add('')
          $status.Add('| slug | done | 1fps JPG | 3x3 sheets | 4fps JPG | transcript | manifest |')
          $status.Add('|---|---:|---:|---:|---:|---:|---:|')
          $complete=0; $totalFrames=0; $totalSheets=0; $totalHigh=0
          foreach($line in $rows) {
            $slug=($line -split '\|',3)[0]
            $root=Join-Path (Join-Path $env:LOCAL_ROOT 'videos') $slug
            $done=Test-Path (Join-Path $root '_DONE.txt')
            $frames=@(Get-ChildItem (Join-Path $root 'frames_1fps') -Filter '*.jpg' -File -ErrorAction SilentlyContinue).Count
            $sheets=@(Get-ChildItem (Join-Path $root 'contact_sheets_3x3') -Filter '*.jpg' -File -ErrorAction SilentlyContinue).Count
            $high=@(Get-ChildItem (Join-Path $root 'high_detail_4fps') -Recurse -Filter '*.jpg' -File -ErrorAction SilentlyContinue).Count
            $transcript=Test-Path (Join-Path $root 'transcript.txt')
            $manifest=Test-Path (Join-Path $root 'manifest.json')
            if($done -and $frames -gt 0 -and $sheets -gt 0 -and $manifest){$complete++}
            $totalFrames += $frames; $totalSheets += $sheets; $totalHigh += $high
            $status.Add("| $slug | $done | $frames | $sheets | $high | $transcript | $manifest |")
          }
          $status.Add('')
          $status.Add("Complete catalog video sets: $complete / $($rows.Count)")
          $status.Add("Total raw 1fps JPG: $totalFrames")
          $status.Add("Total 3x3 sheet JPG: $totalSheets")
          $status.Add("Total high-detail 4fps JPG: $totalHigh")
          $status | Set-Content (Join-Path $env:LOCAL_ROOT 'FINAL_STATUS.md') -Encoding UTF8
          @(
            '# AETHERQOR V4 NIGHT ULTRA RESEARCH - LOCAL ENTRYPOINT',
            '',
            "Root: $env:LOCAL_ROOT",
            "Video sets ready: $complete / $($rows.Count)",
            "Raw 1fps JPG: $totalFrames",
            "3x3 sheet JPG: $totalSheets",
            "High-detail 4fps JPG: $totalHigh",
            '',
            'CLAUDE: read CLAUDE_NIGHT_RESEARCH_HANDOFF.md first, then PRELIMINARY_VERDICTS.md, SOURCE_REGISTRY.md and FINAL_STATUS.md.',
            'For videos use transcript/index -> 3x3 sheets -> selected 1fps -> selected 4fps. Do not scan all JPG blindly.',
            'Reuse V3 evidence from D:\AetherqorFoundry\research\blockers_v3\CLAUDE_VIDEO_REPORT_33904162671.',
            'Do not repeat methods explicitly rejected by measurement.'
          ) | Set-Content (Join-Path $env:LOCAL_ROOT 'LOCAL_READY.md') -Encoding UTF8
          if($env:PROCESS_RESULT -ne 'success'){throw "Recovery video processing failed: $env:PROCESS_RESULT"}
          if($complete -lt $rows.Count){throw "Incomplete local catalog after recovery: $complete / $($rows.Count)"}
          Write-Host 'AETHERQOR_V4_NIGHT_RECOVERY_COMPLETE_13_OF_13'
