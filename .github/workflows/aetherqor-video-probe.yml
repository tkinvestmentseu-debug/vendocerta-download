name: AETHERQOR Video Probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl
          python -m pip install -U pip
          python -m pip install -U --pre yt-dlp bgutil-ytdlp-pot-provider
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Start PO-token provider
        run: |
          mkdir -p out logs
          docker run --name bgutil-provider -d --init --network host brainicism/bgutil-ytdlp-pot-provider:latest
          ready=0
          for i in $(seq 1 30); do
            if curl -g -fsS 'http://[::1]:4416/' >/dev/null 2>&1; then ready=1; echo ipv6 > out/provider_endpoint.txt; break; fi
            if curl -fsS 'http://127.0.0.1:4416/' >/dev/null 2>&1; then ready=1; echo ipv4 > out/provider_endpoint.txt; break; fi
            if ! docker ps --format '{{.Names}}' | grep -qx bgutil-provider; then break; fi
            sleep 1
          done
          docker ps -a > logs/docker_ps.txt
          docker logs bgutil-provider > logs/provider_start.log 2>&1 || true
          if [ "$ready" -ne 1 ]; then echo 'PO provider not reachable'; cat logs/provider_start.log; exit 1; fi

      - name: Download test clip with PO-token provider
        run: |
          mkdir -p out/frames out/meta logs
          VIDEO_URL='https://www.youtube.com/watch?v=3bw2SnKQhwA'
          if grep -q ipv6 out/provider_endpoint.txt; then BASE_URL='http://[::1]:4416'; else BASE_URL='http://127.0.0.1:4416'; fi
          POT_ARGS="youtubepot-bgutilhttp:base_url=$BASE_URL"
          yt-dlp -v --js-runtimes node --extractor-args "$POT_ARGS" -J --skip-download "$VIDEO_URL" > out/meta/info.json 2>logs/meta.err || true
          if yt-dlp -v --js-runtimes node --extractor-args "$POT_ARGS" --download-sections '*00:00:00-00:02:00' --force-keyframes-at-cuts --write-auto-subs --write-subs --sub-langs 'en.*,en' --merge-output-format mp4 -f 'bestvideo[height<=720]+bestaudio/best[height<=720]/18' -o 'out/source.%(ext)s' "$VIDEO_URL" >logs/download.out 2>logs/download.err; then
            echo 'yt-dlp+bgutil-http-po-token' > out/method.txt
          else
            echo 'FAILED' > out/method.txt
            docker logs bgutil-provider > logs/bgutil.log 2>&1 || true
          fi

      - name: Extract frames
        if: always()
        run: |
          src=$(find out -maxdepth 1 -type f \( -name 'source.mp4' -o -name 'source.webm' -o -name 'source.mkv' \) | head -n1 || true)
          if [ -z "$src" ]; then echo 'No video file' > out/no_video.txt; exit 0; fi
          ffmpeg -y -i "$src" -vf "fps=1,scale='min(1280,iw)':-2" -q:v 3 out/frames/frame_%06d.jpg >logs/ffmpeg.out 2>logs/ffmpeg.err
          find out/frames -type f | wc -l > out/frame_count.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-video-probe-3bw2SnKQhwA
          path: |
            out
            logs
          retention-days: 7
