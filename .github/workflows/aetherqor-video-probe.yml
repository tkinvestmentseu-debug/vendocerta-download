name: AETHERQOR Video Probe

on:
  push:
    branches: [aetherqor-video-research]
    paths:
      - '.github/workflows/aetherqor-video-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VIDEO_ID: 3bw2SnKQhwA
  VIDEO_URL: https://www.youtube.com/watch?v=3bw2SnKQhwA

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl
          python -m pip install -U pip
          python -m pip install -U --pre yt-dlp
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Probe and fetch 120 seconds
        shell: bash
        run: |
          set -u
          mkdir -p out/frames out/meta logs
          echo "=== yt-dlp metadata probe ===" | tee logs/probe.log
          yt-dlp -J --skip-download \
            --extractor-args "youtube:player_client=web_safari,web_embedded,tv_embedded" \
            "$VIDEO_URL" > out/meta/info.json 2>>logs/probe.log || true

          echo "=== yt-dlp 120s download ===" | tee -a logs/probe.log
          if yt-dlp \
            --extractor-args "youtube:player_client=web_safari,web_embedded,tv_embedded" \
            --download-sections "*00:00:00-00:02:00" \
            --force-keyframes-at-cuts \
            --write-auto-subs --write-subs --sub-langs "en.*,en" \
            --merge-output-format mp4 \
            -f "bestvideo[height<=720]+bestaudio/best[height<=720]/18" \
            -o "out/source.%(ext)s" \
            "$VIDEO_URL" 2>&1 | tee -a logs/probe.log; then
              echo "DOWNLOAD_METHOD=yt-dlp" > out/method.txt
          else
              echo "yt-dlp failed, trying Piped public APIs" | tee -a logs/probe.log
              ok=0
              for api in \
                https://pipedapi.kavin.rocks \
                https://pipedapi.adminforge.de \
                https://api.piped.private.coffee \
                https://pipedapi.leptons.xyz; do
                echo "Trying $api" | tee -a logs/probe.log
                if curl -fsSL --max-time 25 "$api/streams/$VIDEO_ID" -o out/meta/piped.json; then
                  vurl=$(jq -r '[.videoStreams[]? | select((.height // 9999) <= 720) | select(.url != null)] | sort_by(.height) | reverse | .[0].url // empty' out/meta/piped.json)
                  if [ -n "$vurl" ]; then
                    if ffmpeg -y -t 120 -i "$vurl" -c copy out/source.mp4 >>logs/probe.log 2>&1; then
                      echo "DOWNLOAD_METHOD=piped:$api" > out/method.txt
                      ok=1
                      break
                    fi
                  fi
                fi
              done
              if [ "$ok" -ne 1 ]; then
                echo "DOWNLOAD_METHOD=FAILED" > out/method.txt
              fi
          fi

          ls -lah out | tee -a logs/probe.log

      - name: Extract 1 fps and contact sheets
        shell: bash
        run: |
          set -u
          src=$(find out -maxdepth 1 -type f \( -name 'source.mp4' -o -name 'source.webm' -o -name 'source.mkv' \) | head -n1 || true)
          if [ -z "$src" ]; then
            echo "No video file available" | tee -a logs/probe.log
            exit 0
          fi
          ffmpeg -y -i "$src" -vf "fps=1,scale='min(1280,iw)':-2" -q:v 3 out/frames/frame_%06d.jpg >>logs/probe.log 2>&1
          python - <<'PY'
from PIL import Image, ImageOps, ImageDraw
from pathlib import Path
import math
frames = sorted(Path('out/frames').glob('frame_*.jpg'))
sheets = Path('out/sheets'); sheets.mkdir(exist_ok=True)
for si in range(0, len(frames), 9):
    batch = frames[si:si+9]
    cell_w, cell_h = 426, 260
    canvas = Image.new('RGB', (cell_w*3, cell_h*3), 'black')
    d = ImageDraw.Draw(canvas)
    for j,p in enumerate(batch):
        im = Image.open(p).convert('RGB')
        im.thumbnail((cell_w, cell_h-24))
        x=(j%3)*cell_w+(cell_w-im.width)//2
        y=(j//3)*cell_h+24
        canvas.paste(im,(x,y))
        sec=si+j
        d.text(((j%3)*cell_w+8,(j//3)*cell_h+4), f'{sec:04d}s', fill='white')
    canvas.save(sheets/f'sheet_{si//9:04d}.jpg', quality=90)
PY
          find out/frames -type f | wc -l | tee out/frame_count.txt
          find out/sheets -type f | wc -l | tee out/sheet_count.txt

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-video-probe-${{ env.VIDEO_ID }}
          path: |
            out/
            logs/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
