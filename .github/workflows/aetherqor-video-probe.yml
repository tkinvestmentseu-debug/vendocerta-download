name: AETHERQOR Video Client Matrix

on:
  push:
    branches:
      - main
    paths:
      - 'research/aetherqor/probe.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl
          python -m pip install -U pip
          python -m pip install -U --pre yt-dlp bgutil-ytdlp-pot-provider

      - name: Start PO-token provider
        run: |
          mkdir -p out logs
          docker run --name bgutil-provider -d --init --network host brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 3
          docker ps -a > logs/docker_ps.txt
          docker logs bgutil-provider > logs/provider_start.log 2>&1 || true

      - name: Probe clients without webpage
        shell: bash
        run: |
          set +e
          VIDEO_URL='https://www.youtube.com/watch?v=3bw2SnKQhwA'
          mkdir -p out/client_matrix logs/client_matrix
          clients=(tv web_safari android_vr web_embedded tv_simply mweb)
          for client in "${clients[@]}"; do
            echo "===== $client =====" | tee "logs/client_matrix/${client}.log"
            rm -f "out/client_matrix/${client}.mp4" "out/client_matrix/${client}.webm"
            yt-dlp -v \
              --js-runtimes node \
              --extractor-args "youtube:player_client=${client};player_skip=webpage,configs" \
              --extractor-args "youtubepot-bgutilhttp:base_url=http://localhost:4416" \
              --download-sections '*00:00:00-00:00:20' \
              --force-keyframes-at-cuts \
              -f 'best[height<=480]/bestvideo[height<=480]+bestaudio/best' \
              --merge-output-format mp4 \
              -o "out/client_matrix/${client}.%(ext)s" \
              "$VIDEO_URL" >> "logs/client_matrix/${client}.log" 2>&1
            rc=$?
            size=$(find out/client_matrix -maxdepth 1 -type f -name "${client}.*" -printf '%s\n' | head -n1)
            size=${size:-0}
            echo "$client,$rc,$size" >> out/client_matrix/results.csv
          done
          echo 'client,exit_code,size_bytes' | cat - out/client_matrix/results.csv > out/client_matrix/results2.csv
          mv out/client_matrix/results2.csv out/client_matrix/results.csv
          cat out/client_matrix/results.csv

      - name: Extract proof frames from any successful client
        shell: bash
        run: |
          mkdir -p out/proof_frames
          for f in out/client_matrix/*.mp4 out/client_matrix/*.webm; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ffmpeg -y -i "$f" -vf 'fps=1' -frames:v 5 "out/proof_frames/${base%.*}_%02d.jpg" >/dev/null 2>&1 || true
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-video-client-matrix
          path: |
            out
            logs
          retention-days: 7
