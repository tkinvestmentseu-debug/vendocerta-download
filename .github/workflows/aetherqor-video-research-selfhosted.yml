name: AETHERQOR Video Research Self-Hosted

on:
  push:
    branches:
      - main
    paths:
      - 'research/aetherqor/run.trigger'
  workflow_dispatch:
    inputs:
      video_filter:
        description: "all or one slug from research/aetherqor/videos.psv"
        required: true
        default: "all"
        type: string
      browser:
        description: "Browser used for AETHERQOR browser steps"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
      max_height:
        description: "Maximum source video height"
        required: true
        default: "1080"
        type: choice
        options:
          - "720"
          - "1080"

concurrency:
  group: aetherqor-video-research
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Cancel stale AETHERQOR research runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set +e
          gh run list --repo "$REPO" --workflow aetherqor-video-research-selfhosted.yml --limit 30 \
            --json databaseId,status \
            --jq '.[] | select(.databaseId != ('"$CURRENT_RUN"'|tonumber)) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending") | .databaseId' \
            | while read -r id; do
                [ -z "$id" ] && continue
                echo "Cancelling stale run $id"
                gh run cancel "$id" --repo "$REPO" || true
              done
          set -e

      - name: Build video matrix
        id: matrix
        env:
          INPUT_VIDEO_FILTER: ${{ inputs.video_filter || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          filt=(os.environ.get('INPUT_VIDEO_FILTER') or '').strip()
          if not filt:
              try:
                  txt=open('research/aetherqor/run.trigger',encoding='utf-8').read()
                  m=re.search(r'^MODE=(.+)$',txt,re.M)
                  filt=m.group(1).strip() if m else 'all'
              except FileNotFoundError:
                  filt='all'
          rows=[]
          with open('research/aetherqor/videos.psv', encoding='utf-8') as f:
              for raw in f:
                  line=raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  slug,url,topic=line.split('|',2)
                  if filt != 'all' and slug != filt:
                      continue
                  rows.append({'slug':slug,'url':url,'topic':topic})
          if not rows:
              raise SystemExit(f'No videos matched filter: {filt}')
          matrix=json.dumps({'include':rows}, separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('matrix='+matrix+'\n')
          print('filter=',filt)
          print(matrix)
          PY

  process:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, aetherqor-video]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Process tutorial second-by-second
        shell: pwsh
        env:
          VIDEO_URL: ${{ matrix.url }}
          VIDEO_SLUG: ${{ matrix.slug }}
          VIDEO_TOPIC: ${{ matrix.topic }}
          VIDEO_BROWSER: chrome
          VIDEO_MAX_HEIGHT: ${{ inputs.max_height || '1080' }}
        run: |
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $out = Join-Path $env:RUNNER_TEMP 'aetherqor-video'
          & .\tools\process-aetherqor-video.ps1 `
            -Url $env:VIDEO_URL `
            -Slug $env:VIDEO_SLUG `
            -Topic $env:VIDEO_TOPIC `
            -Browser $env:VIDEO_BROWSER `
            -OutputRoot $out `
            -FrameFps 1 `
            -HighDetailFps 4 `
            -MaxHeight ([int]$env:VIDEO_MAX_HEIGHT) `
            -HighDetailMaxSeconds 360

      - name: Prepare compact metadata package
        if: always()
        shell: pwsh
        env:
          VIDEO_SLUG: ${{ matrix.slug }}
        run: |
          $root = Join-Path (Join-Path $env:RUNNER_TEMP 'aetherqor-video') $env:VIDEO_SLUG
          $meta = Join-Path $env:RUNNER_TEMP 'aetherqor-upload-meta'
          if (Test-Path $meta) { Remove-Item $meta -Recurse -Force }
          New-Item -ItemType Directory -Path $meta -Force | Out-Null
          foreach ($name in @('manifest.json','frame_index.csv','sheet_index.csv','high_detail_index.csv','duration_seconds.txt','transcript.txt','transcript_source.txt','TRANSCRIPT_MISSING.txt','source.info.json')) {
            $p = Join-Path $root $name
            if (Test-Path $p) { Copy-Item $p $meta -Force }
          }
          $logs = Join-Path $root 'logs'
          if (Test-Path $logs) { Copy-Item $logs (Join-Path $meta 'logs') -Recurse -Force }

      - name: Upload metadata and transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-${{ matrix.slug }}-meta-${{ github.run_number }}
          path: ${{ runner.temp }}\aetherqor-upload-meta
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Upload 3x3 contact sheets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-${{ matrix.slug }}-sheets-${{ github.run_number }}
          path: ${{ runner.temp }}\aetherqor-video\${{ matrix.slug }}\contact_sheets_3x3
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Upload 1fps frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-${{ matrix.slug }}-frames-${{ github.run_number }}
          path: ${{ runner.temp }}\aetherqor-video\${{ matrix.slug }}\frames_1fps
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Upload 4fps high-detail frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aetherqor-${{ matrix.slug }}-highdetail-${{ github.run_number }}
          path: ${{ runner.temp }}\aetherqor-video\${{ matrix.slug }}\high_detail_4fps
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Clean local result after upload
        if: always()
        shell: pwsh
        env:
          VIDEO_SLUG: ${{ matrix.slug }}
        run: |
          $path = Join-Path (Join-Path $env:RUNNER_TEMP 'aetherqor-video') $env:VIDEO_SLUG
          if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          $meta = Join-Path $env:RUNNER_TEMP 'aetherqor-upload-meta'
          if (Test-Path $meta) { Remove-Item $meta -Recurse -Force }
