name: AETHERQOR Blocker Video Discovery

on:
  push:
    paths:
      - 'research/aetherqor/blockers_v3/DISCOVERY_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: aetherqor-blocker-video-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: [self-hosted, Windows, X64, aetherqor-video]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Discover YouTube candidates through local residential IP
        shell: pwsh
        run: |
          ./tools/discover-aetherqor-blocker-videos.ps1 -OutputDir "$env:RUNNER_TEMP\aetherqor-blocker-video-discovery" -PerQuery 5
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: AETHERQOR_BLOCKER_VIDEO_CANDIDATES
          path: ${{ runner.temp }}\aetherqor-blocker-video-discovery\*
          retention-days: 14
          if-no-files-found: error
