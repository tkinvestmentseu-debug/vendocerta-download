name: AETHERQOR RunicWarden Modular V3 Assemble

on:
  push:
    paths:
      - 'research/aetherqor/runicwarden_build/MODULAR_V3_ASSEMBLE_TRIGGER.txt'
  workflow_dispatch:

concurrency:
  group: aetherqor-runicwarden-modular-v3-assemble
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: [self-hosted, Windows, X64, aetherqor-video]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve V3 master and rigged body
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $master='D:\AetherqorPipeline\ChatGPT_RunicWarden_Builds\modular_v3_master'
          $body='D:\AetherqorPipeline\ChatGPT_RunicWarden_Builds\resume_33979880265\generated\models\Body_Rigged.glb'
          if(-not (Test-Path -LiteralPath $master)){ throw "V3 master missing: $master" }
          if(-not (Test-Path -LiteralPath $body)){ throw "Body_Rigged missing: $body" }
          foreach($s in @('Helmet','Chest','Shoulders','Gloves','Belt','Legs','Boots','Cloak','Sword','Shield','ClassRelic')){
            $p=Join-Path $master "models\$s\${s}_source.glb"
            if(-not (Test-Path -LiteralPath $p)){ throw "Missing V3 3D source: $p" }
            if($p -match 'SmokeTest'){ throw "SMOKETEST_REJECTED: $p" }
          }
          $root="D:\AetherqorPipeline\ChatGPT_RunicWarden_Builds\modular_v3_assemble_fixed_$env:GITHUB_RUN_ID"
          $out=Join-Path $root 'quarantine'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "AQ_MASTER=$master" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AQ_BODY=$body" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AQ_OUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MASTER=$master"
          Write-Host "BODY=$body"
          Write-Host "OUT=$out"
          Write-Host 'MESHY_CALLS=0'

      - name: Assemble one Runic Warden on Body_Rigged
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $blender='C:\Program Files\Blender Foundation\Blender 5.2\blender.exe'
          if(-not (Test-Path -LiteralPath $blender)){ throw 'Blender 5.2 missing.' }
          & $blender --background --python "$env:GITHUB_WORKSPACE\research\aetherqor\runicwarden_build\assemble_modular_v3_fixed.py" -- --master $env:AQ_MASTER --body $env:AQ_BODY --out $env:AQ_OUT
          if($LASTEXITCODE -ne 0){ throw "Blender assembly exit=$LASTEXITCODE" }

      - name: Hard static assembly gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qa=Join-Path $env:AQ_OUT 'reports\assembly_v3_qa.json'
          if(-not (Test-Path -LiteralPath $qa)){ throw 'assembly_v3_qa.json missing' }
          $j=Get-Content -LiteralPath $qa -Raw | ConvertFrom-Json
          if([int]$j.bones -lt 15){ throw "RIG_FAIL bones=$($j.bones)" }
          if(-not $j.underarmor){ throw 'UNDERARMOR_MISSING' }
          $required=@('Helmet','Chest','Shoulders','Gloves','Belt','Legs','Boots','Cloak','Sword','Shield','ClassRelic')
          foreach($s in $required){ if(-not ($j.slots.PSObject.Properties.Name -contains $s)){ throw "SLOT_MISSING $s" } }
          foreach($r in @('front','three_quarter','side','back')){
            $p=Join-Path $env:AQ_OUT "renders\$r.png"
            if(-not (Test-Path -LiteralPath $p)){ throw "RENDER_MISSING $r" }
          }
          foreach($ext in @('blend','fbx','glb')){
            $p=Join-Path $env:AQ_OUT "AETHERQOR_RUNIC_WARDEN_FULL_MALE_V3_QUARANTINE.$ext"
            if(-not (Test-Path -LiteralPath $p)){ throw "EXPORT_MISSING $ext" }
          }
          Write-Host "STATIC_GATE_READY bones=$($j.bones) tris=$($j.total_tris) underarmor=PASS"

      - name: Copy only to V3 fixed quarantine staging
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dst='D:\Aetherfall - Realms of the Veil\Assets\Aetherqor\Art\Characters\RunicWarden\ChatGPT_AAA_V3_FIXED_QUARANTINE'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -LiteralPath $env:AQ_OUT -File | Where-Object { $_.Extension -in @('.blend','.fbx','.glb','.json') } | Copy-Item -Destination $dst -Force
          Write-Host "QUARANTINE_STAGING=$dst"

      - name: Upload one-character fixed visual gate
        uses: actions/upload-artifact@v4
        with:
          name: AETHERQOR_RUNIC_WARDEN_MODULAR_V3_FIXED_VISUAL_GATE
          path: |
            ${{ env.AQ_OUT }}\renders\*.png
            ${{ env.AQ_OUT }}\reports\*.json
            ${{ env.AQ_OUT }}\AETHERQOR_RUNIC_WARDEN_FULL_MALE_V3_MANIFEST.json
          retention-days: 7
          compression-level: 0

      - name: Upload V3 fixed quarantine character
        uses: actions/upload-artifact@v4
        with:
          name: AETHERQOR_RUNIC_WARDEN_MODULAR_V3_FIXED_MODELS
          path: |
            ${{ env.AQ_OUT }}\AETHERQOR_RUNIC_WARDEN_FULL_MALE_V3_QUARANTINE.blend
            ${{ env.AQ_OUT }}\AETHERQOR_RUNIC_WARDEN_FULL_MALE_V3_QUARANTINE.fbx
            ${{ env.AQ_OUT }}\AETHERQOR_RUNIC_WARDEN_FULL_MALE_V3_QUARANTINE.glb
          retention-days: 7
          compression-level: 0
